apiVersion: v1
kind: PersistentVolumeClaim 
metadata: 
  name: {{ .Values.pvcname }}
spec: 
  accessModes:
    - {{ .Values.accessModes }}
  storageClassName: {{ .Values.storageClassName }}
  volumeMode: {{ .Values.volumeMode }}
  resources: 
    requests: 
      storage: {{ .Values.requests }} 
   

