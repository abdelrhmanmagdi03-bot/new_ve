apiVersion: v1
kind: Service 
metadata:
  name: {{ .Values.nameservices }}
spec: 
  type: {{ .Values.typeofservices }}
  selector: 
    app: {{ .Values.labels }}
  ports: 
    - name: {{ .Values.nemme }}
      nodePort: {{ .Values.nodePort }}
      protocol: {{ .Values.portpro }}
      port: {{ .Values.containerPortnumber }}
      targetPort: {{ .Values.targetPort }}
    
