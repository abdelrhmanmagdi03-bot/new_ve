apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: {{ .Values.ingressname }}
spec:
  rules: 
    - host: {{ .Values.hostname }}
      http:
        paths:
         - pathType: {{ .Values.pathType }}
           path: {{ .Values.path }}
           backend: 
            service:
              name: {{ .Values.nameservices }}
              port: 
               number: 80 
