apiVersion: v1
kind: ConfigMap
metadata:
  name: mainconfig
data:
  dateandtime: {{ .Values.config.dateandtime | quote }}
  title: {{ .Values.config.title | quote }}
  user: {{ .Values.config.user | quote }}
  MONGO_URI: {{ .Values.config.MONGO_URI | quote }}
  PORT: {{ .Values.config.PORT | quote }} 
